spring.application.name=BLOCO

server.port=3000
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/BLOCO}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false

security.jwt.secret-base64=${JWT_SECRET_BASE64:}
security.jwt.issuer=${JWT_ISSUER:BLOCO}
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
security.jwt.cookie-secure=${AUTH_COOKIE_SECURE:true}